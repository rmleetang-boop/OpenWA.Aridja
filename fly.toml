# fly.toml app configuration file generated for openwa-aridja-agxfyw on 2026-08-28T05:23:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openwa-aridja-agxfyw'
primary_region = 'jnb'

[build]

[processes]
  app = 'node ./dbsetup.js node dist/main'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 2785
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
